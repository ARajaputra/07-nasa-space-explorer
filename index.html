<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div>
        <p class="eyebrow">ASTRONOMY PICTURE OF THE DAY</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <main>
      <section class="fact" aria-labelledby="fact-title">
        <p class="eyebrow" id="fact-title">DID YOU KNOW?</p>
        <p id="spaceFact"></p>
      </section>

      <form class="filters" id="dateForm">
        <label>
          <span>From</span>
          <input type="date" id="startDate" required />
        </label>
        <label>
          <span>Through</span>
          <input type="date" id="endDate" required />
        </label>
        <button type="submit" id="submitButton">Get Space Images</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite">Choose a date range to explore NASA's archive.</p>
      <section id="gallery" class="gallery" aria-label="Astronomy pictures"></section>
    </main>
  </div>

  <dialog class="image-dialog" id="imageDialog" aria-labelledby="dialogTitle">
    <button class="dialog-close" id="closeDialog" type="button" aria-label="Close image details">Close</button>
    <img class="dialog-image" id="dialogImage" alt="" />
    <div class="dialog-copy">
      <p class="eyebrow" id="dialogDate"></p>
      <h2 id="dialogTitle"></h2>
      <p id="dialogExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
